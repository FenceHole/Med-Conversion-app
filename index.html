<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med Conversion App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        max-width: 720px;
      }
      label {
        display: block;
        margin-top: 0.75rem;
      }
      input,
      select,
      button {
        margin-top: 0.25rem;
        padding: 0.4rem;
        width: 100%;
        box-sizing: border-box;
      }
      #result {
        margin-top: 1rem;
        font-weight: bold;
      }
      .note {
        margin-top: 1rem;
        color: #555;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <h1>Med Conversion App</h1>
    <p>Convert one stimulant to another or one mood stabilizer to another.</p>

    <label for="category">Medication Class</label>
    <select id="category">
      <option value="stimulants">Stimulants</option>
      <option value="moodStabilizers">Mood Stabilizers</option>
    </select>

    <label for="fromMed">From Medication</label>
    <select id="fromMed"></select>

    <label for="toMed">To Medication</label>
    <select id="toMed"></select>

    <label for="dose">Dose (mg)</label>
    <input id="dose" type="number" min="0" step="0.1" placeholder="Enter dose in mg" />

    <button id="convertBtn" type="button">Convert</button>
    <div id="result" aria-live="polite"></div>
    <div class="note">
      Note: conversions are rough estimates and are not a substitute for medical advice.
    </div>

    <script src="./app.js"></script>
  </body>
</html>
